[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openwatch-engine"
version = "0.2.0"
description = "Transactional change monitoring with durable events and replayable sources"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
classifiers = ["Development Status :: 3 - Alpha", "Programming Language :: Python :: 3"]

[project.scripts]
openwatch = "openwatch.__main__:main"

[tool.setuptools.packages.find]
include = ["openwatch*"]
